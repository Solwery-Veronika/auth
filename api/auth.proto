syntax = "proto3";

// protoc --go_out=./pkg --go-grpc_out=./pkg api/auth.proto
option go_package = "./auth";

service AuthService {
  rpc Signup(SignupRequest) returns (SignupResponse) {};
  rpc Login(LoginIn) returns(LoginOut) {};
  rpc ChangeLogin(ChangeLoginIn) returns(ChangeLoginOut) {};
}

message LoginIn{
  string username = 1;
  string email = 2; 
  string password = 3;

}
message LoginOut{
  string token = 1;
}

//Signup
message SignupRequest{
  string username = 1;
  string password = 2;
}

message SignupResponse{
  bool success = 1;
}

message ChangeLoginIn{
  string username = 1; 
  string password = 2;
  string newUsername = 3;
}

message ChangeLoginOut{
  bool success = 1;
}
